services:
  shoes-panel:
    image: ghcr.io/huangming774/shoes-ui:latest
    # Uncomment 'build: .' below if you want to build locally from source instead of pulling GHCR image
    # build: .
    container_name: shoes-panel
    restart: unless-stopped
    # Host networking allows newly created inbound ports (TCP & UDP/QUIC) to listen immediately without container recreation
    network_mode: host
    environment:
      - SHOES_PANEL_DATA=/etc/shoes-panel
      - PANEL_PORT=54321
      - TZ=Asia/Shanghai
    volumes:
      - ./data:/etc/shoes-panel
